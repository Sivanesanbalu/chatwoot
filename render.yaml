services:
  - type: web
    name: chatwoot-web
    runtime: docker
    dockerfilePath: docker/Dockerfile
    repo: https://github.com/Sivanesanbalu/chatwoot
    branch: main
    plan: starter
    region: oregon
    startCommand: "bundle exec rails server -b 0.0.0.0 -p $PORT"
    envVars:
      - key: NODE_ENV
        value: production
      - key: RAILS_ENV
        value: production
      - key: INSTALL_KEY
        generateValue: true
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: POSTGRES_DATABASE
        fromDatabase:
          name: chatwoot-db
          property: database
      - key: POSTGRES_USERNAME
        fromDatabase:
          name: chatwoot-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: chatwoot-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: chatwoot-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: chatwoot-db
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString

  - type: worker
    name: chatwoot-worker
    runtime: docker
    dockerfilePath: docker/Dockerfile
    repo: https://github.com/Sivanesanbalu/chatwoot
    branch: main
    plan: starter
    region: oregon
    startCommand: "bundle exec sidekiq -C config/sidekiq.yml"
    envVars:
      - key: NODE_ENV
        value: production
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        sync: false
      - key: POSTGRES_DATABASE
        fromDatabase:
          name: chatwoot-db
          property: database
      - key: POSTGRES_USERNAME
        fromDatabase:
          name: chatwoot-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: chatwoot-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: chatwoot-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: chatwoot-db
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString

databases:
  - name: chatwoot-db
    databaseName: chatwoot_production
    user: chatwoot
    plan: free

  - name: chatwoot-redis
    plan: free
    maxmemoryPolicy: noeviction
